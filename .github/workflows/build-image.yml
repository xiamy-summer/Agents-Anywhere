name: Build & Push Agents Anywhere Server

# 放到 fork 后的仓库：.github/workflows/build-image.yml
# 触发后会在 GitHub 境外服务器上构建 Server 镜像，推送到 GHCR（GitHub 容器仓库）。
# 群晖 NAS 之后只需拉取镜像，不用再在本地访问 GitHub / 编译源码。

on:
  workflow_dispatch:          # 允许在 Actions 页面手动点运行
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web-next/**'
      - 'docker/**'
      - '.github/workflows/build-image.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推送镜像到 GHCR 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 镜像名必须小写，这里把 用户名/仓库名 转成小写
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # 国内网络构建时可打开下面两个镜像源（取消注释即可）
          build-args: |
            APT_MIRROR=https://mirrors.ustc.edu.cn/debian
            PIP_INDEX_URL=https://mirrors.ustc.edu.cn/pypi/simple
            YARN_REGISTRY=https://registry.npmmirror.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
